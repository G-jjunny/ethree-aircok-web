name: "🔧 Chore"
description: 설정, 리팩토링, 의존성 업데이트 등
labels: ["chore"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: 작업 범위
      options:
        - frontend
        - backend
        - fullstack
        - infra
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: 작업 유형
      options:
        - 설정 변경
        - 리팩토링
        - 의존성 업데이트
        - CI/CD
        - 문서
        - 기타
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 작업 내용
      description: 무엇을 변경하나요?
      placeholder: 변경 사항과 이유를 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: 체크리스트
      placeholder: |
        - [ ] ...
        - [ ] ...

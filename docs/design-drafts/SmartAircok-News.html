<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<!--
  출처: Claude Design 프로젝트 15fc4772-51fe-4117-9810-2659d738aa1b / "news.dc.html"
  용도: /news(목록) + /news/[id](상세) 재디자인 참조. 블루-테크 토큰(랜딩과 공유).
  토큰 raw 값: docs/design-drafts/TOKEN-EXTRACTION.md 참조.

  === 현재 모델 매핑 (중요 — 백엔드/API 변경 없이 현행 기능 유지) ===
  시안 필드        → 현재 NewsSummary/NewsPost 필드
    type link/post → type 'LINK'/'BLOG'
    badge          → 'LINK'→"외부 링크"(다크 반투명 배지) / 'BLOG'→"게시글"(brand 배지)
    thumb          → coverImage (없으면 줄무늬 플레이스홀더)
    category(굵은) → 현재 category 필드 없음 → 생략하거나 type 라벨로 대체(신설 금지)
    date           → date (ISO → 표시 포맷 YYYY.MM.DD)
    title/excerpt  → title / description
    link 카드 클릭 → externalUrl 새 탭 열기(window.open noopener). 상세 이동 아님.
    post 카드 클릭 → /news/[id] 상세 이동 (Link)
    상세 author    → 현재 author 필드 없음 → SITE 기본값 또는 생략
    상세 본문      → content(HTML) 그대로 렌더(prose). 시안의 para 배열은 예시일 뿐, 실제는 HTML.
  검색/타입필터/페이지네이션: /news API가 page/limit만 지원 → 클라이언트 측 처리(시안과 동일).
-->
<x-dc>

<!-- HEADER (공유) / 사용 안 함 — 실제는 (main) 레이아웃 -->

<!-- PAGE HERO — 다크 radial + 드리프트 글로우. 현재 shared <PageHero> 재사용 -->
<section style="background:radial-gradient(120% 90% at 78% 0%,#12224d,#0a1020 55%,#070b16 100%);color:#fff">
  <!-- eyebrow NEWS(cyan) + h1 46px "뉴스" + 설명 "에어콕의 새로운 소식과 보도자료, 공기질 인사이트를 전해드립니다." -->
</section>

<!-- ============ 목록 뷰 ============ -->
<section style="background:#fff;padding:56px 0 96px">
  <div style="max-width:1240px;margin:0 auto;padding:0 32px">

    <!-- 검색 + 필터 (border-bottom hairline, pb 24) -->
    <!-- 좌: 필터 칩 3개(전체/뉴스 링크/게시글) — 활성 bg-brand 흰글씨 / 비활성 흰bg border muted. rounded-pill, py-2.5 px-5 -->
    <!-- 우: 검색 인풋(min 260, flex 320). 돋보기 아이콘 좌측, placeholder "제목·카테고리 검색",
         focus 시 border-brand + ring rgba(43,107,255,.12). 입력 있으면 우측 × 클리어 버튼(원형 회색) -->

    <!-- 카드 그리드: margin-top 36; grid repeat(3,1fr) gap 24 -->
    <!-- 카드: flex-col, border hairline, rounded 18, overflow-hidden, cursor-pointer,
         shadow 0 8px 24px rgba(13,21,38,.04), hover translateY(-4) + shadow 강화, transition .15s -->
      <!-- thumb: aspect 16/10. coverImage 있으면 이미지, 없으면 줄무늬(link=회색계, post=연블루계) + 라벨.
           좌상단 배지: link "외부 링크"(bg rgba(10,16,32,.72) 흰, blur) / post "게시글"(bg-brand 흰). rounded-pill 11.5px 700.
           link일 때 우상단 외부링크 아이콘 원형(흰 배경, brand 화살표 ↗) -->
      <!-- body: padding 22 24 24, flex-col flex-1
           메타: category(굵은 ink, 현재 필드없음→생략/type) · date(muted) 12.5px
           title: mt-10 17px 800 line-1.4 tracking-tight
           excerpt(description): mt-10 13.5px muted line-1.65 flex-1
           CTA: mt-16 12.5px 700 brand + 화살표(→). link="기사 원문 보기" / post="게시글 읽기" -->

    <!-- 빈 상태: mt-36 padding 64 24 text-center, border hairline rounded 18 bg #f7f9fc.
         "검색 결과가 없습니다" 16px 700 + "'{query}'에 대한 소식을 찾지 못했어요. 다른 검색어를 입력해 보세요." -->

    <!-- 페이지네이션(totalPages>1): mt-44 center gap-2.
         이전/다음 버튼 40x40 rounded-10 border hairline (disabled opacity .4),
         페이지 번호 버튼 min-w-40 h-40 rounded-10 — 활성 bg-brand 흰 / 비활성 흰bg border ink. pageSize 예: 6~9 -->
  </div>
</section>

<!-- ============ 상세 뷰 (/news/[id], BLOG only) ============ -->
<section style="background:#fff;padding:44px 0 96px;animation:fade .4s">
  <article style="max-width:760px;margin:0 auto;padding:0 32px">
    <!-- "목록으로" 버튼: inline-flex, ← 아이콘 + 텍스트, border hairline rounded-10 py-2 px-4 13.5px 600, hover bg #f5f7fb. → Link /news -->
    <!-- 카테고리/타입 배지: mt-28 inline-block rounded-pill bg #eef3ff border #dce6ff brand 12px 700 -->
    <!-- 제목 h1: mt-16 34px 800 line-1.3 tracking-headline text-wrap:pretty -->
    <!-- 메타: mt-16 author(굵은 ink, 없으면 생략) · date, 13.5px muted, pb-24 border-bottom hairline -->
    <!-- 대표 이미지: mt-28 rounded-16 aspect 16/9. coverImage 있으면 이미지, 없으면 줄무늬 플레이스홀더 -->
    <!-- 본문: mt-32 16px line-1.9 color #2c3648. 실제는 content(HTML) → prose 렌더.
         (시안 예시: h2 21px 800 제목 + p 문단 반복) -->
    <!-- 하단: mt-48 pt-24 border-top hairline, 좌 안내문 + 우 "문의하기" 버튼(brand 그라디언트 rounded-10) → /contact -->
  </article>
</section>

<!-- CTA + FOOTER (공유 위젯 GlobalCta/Footer 재사용) -->

</x-dc>
</body>
</html>
